name: Windows CI

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Windows application
        shell: powershell
        run: .\windows\build.ps1

      - name: Run self-tests
        shell: powershell
        run: .\windows\dist\CodexMeter.Tests.exe

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: CodexMeter-Windows-unsigned
          path: |
            windows/dist/CodexMeter.exe
            windows/dist/CodexMeter.exe.config
          if-no-files-found: error
